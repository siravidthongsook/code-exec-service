name: "code-exec-service"
mode: ONCE
hostname: "code-exec"
cwd: "/work"
log_level: ERROR
clone_newnet: true

mount { src: "/bin" dst: "/bin" is_bind: true }
mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/lib" dst: "/lib" is_bind: true }
mount { src: "/etc" dst: "/etc" is_bind: true }
mount { src: "/tmp" dst: "/tmp" is_bind: true }
mount { src: "/var/tmp" dst: "/var/tmp" is_bind: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }

# Workdir bind is passed by CLI: -B <host_workdir>:/work.
